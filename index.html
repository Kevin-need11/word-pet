<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="單字寵物">
<meta name="theme-color" content="#bfe3ff">
<title>單字寵物 · 學英文養小龍</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}
  html,body{height:100%;}
  body{background:#eaf6ff;color:#2b3145;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .app{width:100%;max-width:520px;height:100%;max-height:940px;display:flex;flex-direction:column;position:relative;overflow:hidden;}
  .hidden{display:none!important;}
  .btn{background:#ffcf3f;color:#5b3a00;font-weight:900;border:none;border-radius:16px;padding:15px;font-size:21px;cursor:pointer;box-shadow:0 6px 0 #d9a900;transition:.05s;width:100%;}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d9a900;}

  #login{margin:auto;text-align:center;padding:26px;}
  #login .logo{font-size:96px;margin-bottom:6px;animation:bob 2.6s ease-in-out infinite;}
  #login h1{font-size:32px;font-weight:900;margin-bottom:8px;}
  #login p{font-size:16px;opacity:.85;margin-bottom:26px;}
  #login input{width:100%;font-size:23px;padding:15px 18px;border:none;border-radius:16px;text-align:center;color:#333;font-weight:700;margin-bottom:14px;box-shadow:0 3px 10px rgba(90,130,180,.18);}

  #home{height:100%;display:flex;flex-direction:column;}
  .hud{display:flex;align-items:center;gap:8px;padding:12px 14px 4px;}
  .hud .coin{background:#fff;border-radius:999px;padding:6px 12px;font-weight:900;font-size:16px;box-shadow:0 2px 8px rgba(90,130,180,.15);}
  .hud .who{flex:1;text-align:center;font-weight:900;font-size:15px;color:#3a3a55;}
  .hud .who small{display:block;font-size:11px;opacity:.7;font-weight:700;}
  .hud .gear{background:#fff;border:none;border-radius:999px;width:36px;height:36px;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(90,130,180,.15);}

  /* 照顧狀態列 */
  .care{display:flex;gap:8px;padding:2px 14px 6px;}
  .cchip{flex:1;background:#fff;border-radius:12px;padding:6px 8px 7px;box-shadow:0 2px 8px rgba(90,130,180,.12);cursor:pointer;transition:.05s;}
  .cchip:active{transform:scale(.97);}
  .cchip .ct{font-size:11px;font-weight:800;color:#5a6a8c;display:flex;justify-content:space-between;margin-bottom:3px;}
  .cbar{height:8px;background:#eef2f8;border-radius:999px;overflow:hidden;}
  .cbar>i{display:block;height:100%;width:0;transition:width .4s;border-radius:999px;}
  .cbar.hunger>i{background:#ff9e5b;} .cbar.mood>i{background:#ffcf3f;} .cbar.clean>i{background:#5ec8ff;}

  /* 多寵物切換列 */
  .petbar{display:flex;gap:6px;padding:0 14px 4px;overflow-x:auto;}
  .pchip{flex:none;width:44px;height:44px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border:2px solid #e6ebf5;box-shadow:0 2px 6px rgba(90,130,180,.12);position:relative;overflow:hidden;}
  .pchip img{max-width:36px;max-height:36px;object-fit:contain;}
  .pchip.on{border-color:#5b8def;}
  .pchip .dot{position:absolute;top:2px;right:3px;font-size:10px;}
  .pchip.add{background:#fff6da;color:#c79200;font-weight:900;border-color:#ffe28a;font-size:24px;}

  .scene{flex:1;margin:4px 14px;border-radius:26px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#aedcff 0%,#d3efff 46%,#bff0c8 62%,#a6e39a 100%);
    box-shadow:inset 0 2px 0 #fff,0 6px 18px rgba(90,140,180,.2);display:flex;align-items:center;justify-content:center;}
  .scene .sun{position:absolute;top:18px;right:22px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#fff3b0,#ffd54a);box-shadow:0 0 26px #ffe58a;}
  .scene .cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;}
  .scene .c1{width:76px;height:24px;top:15%;left:12%;box-shadow:24px 6px 0 -4px #fff,-20px 6px 0 -6px #fff;animation:drift 9s ease-in-out infinite;}
  .scene .c2{width:56px;height:18px;top:24%;right:16%;box-shadow:18px 5px 0 -4px #fff;animation:drift 11s ease-in-out infinite reverse;}
  .stagebadge{position:absolute;top:12px;left:14px;background:#ffcf3f;color:#5b3a00;font-weight:900;font-size:12px;padding:5px 12px;border-radius:999px;box-shadow:0 3px 8px rgba(180,140,0,.3);z-index:3;}
  .decor{position:absolute;inset:0;pointer-events:none;}
  .decor span{position:absolute;font-size:34px;filter:drop-shadow(0 3px 3px rgba(60,90,60,.2));}
  .hero{display:flex;flex-direction:column;align-items:center;z-index:2;}
  .hero .avatar{font-size:130px;line-height:1;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 12px 10px rgba(60,90,120,.25));}
  .hero .avatar img{max-height:200px;max-width:74%;object-fit:contain;filter:drop-shadow(0 12px 10px rgba(60,90,120,.25));}
  .hero .shadow{width:120px;height:18px;background:rgba(60,110,60,.22);border-radius:50%;margin-top:-4px;filter:blur(3px);}
  .petname{position:absolute;bottom:54px;width:100%;text-align:center;font-weight:900;font-size:17px;color:#2f5a34;text-shadow:0 1px 0 #ffffffaa;}
  .xpwrap{position:absolute;bottom:14px;left:24px;right:24px;}
  .xpwrap .lvtag{font-size:12px;font-weight:900;color:#2f5a34;margin-bottom:4px;text-shadow:0 1px 0 #fff9;}
  .bar{height:13px;background:rgba(255,255,255,.65);border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.1);}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#7bff9b,#39d353);width:0;transition:width .4s;}
  /* 外出狀態遮罩 */
  .away{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:4;background:rgba(240,250,255,.55);backdrop-filter:blur(1px);}
  .away .big{font-size:64px;animation:bob 2.6s ease-in-out infinite;}
  .away .txt{font-weight:900;font-size:17px;color:#3a5a7a;margin-top:8px;}
  .away .timer{font-weight:900;font-size:22px;color:#2b6bd6;margin-top:4px;font-variant-numeric:tabular-nums;}
  .away .claim{margin-top:12px;background:#39d353;color:#fff;border:none;border-radius:14px;padding:12px 26px;font-size:18px;font-weight:900;box-shadow:0 5px 0 #2bb344;cursor:pointer;}
  .away .claim:active{transform:translateY(3px);box-shadow:0 2px 0 #2bb344;}

  .actions{display:flex;gap:6px;padding:8px 12px 14px;}
  .act{flex:1;border:none;border-radius:16px;padding:11px 2px 9px;font-weight:900;font-size:13px;cursor:pointer;
    background:#fff;color:#3a3a55;box-shadow:0 5px 0 #d7deee;transition:.05s;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .act:active{transform:translateY(3px);box-shadow:0 2px 0 #d7deee;}
  .act .ic{font-size:24px;}
  .act.learn{background:#cfe6ff;box-shadow:0 5px 0 #a7cdf3;}
  .act.feed{background:#ffe0b0;box-shadow:0 5px 0 #eebd7d;}
  .act.work{background:#d9f0d0;box-shadow:0 5px 0 #b3d8a4;}
  .act:disabled{opacity:.45;}

  /* bottom sheet 通用 */
  .sheetwrap{position:absolute;inset:0;background:rgba(30,50,70,.35);display:flex;align-items:flex-end;z-index:15;}
  .sheet2{background:#fff;width:100%;max-height:88%;border-radius:24px 24px 0 0;padding:10px 16px 16px;display:flex;flex-direction:column;box-shadow:0 -6px 24px rgba(30,50,70,.25);animation:slideup .25s ease;overflow:auto;}
  @keyframes slideup{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .grab{width:44px;height:5px;background:#dfe3ee;border-radius:999px;margin:2px auto 8px;flex:none;}
  .lhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .ltitle{font-weight:900;font-size:16px;flex:1;}
  .close{background:#f2f4fb;border:none;border-radius:999px;width:34px;height:34px;font-size:18px;cursor:pointer;color:#5a6a8c;flex:none;}

  .daily{background:#f5faff;border-radius:12px;padding:7px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;color:#3a3a55;margin-bottom:8px;}
  .daily .dbar{flex:1;height:9px;background:#e3e9f2;border-radius:999px;overflow:hidden;}
  .daily .dbar>i{display:block;height:100%;background:#ffcf3f;width:0;transition:width .4s;}
  .tabs{display:flex;gap:6px;}
  .tab{flex:1;background:#eef2fb;color:#5a6a8c;border:none;border-radius:12px 12px 0 0;padding:9px 2px;font-size:14px;font-weight:800;cursor:pointer;}
  .tab.on{background:#5b8def;color:#fff;}
  .quiz{background:#f7f9ff;color:#2b2b3a;border-radius:0 12px 12px 12px;padding:16px;flex:1;display:flex;flex-direction:column;min-height:300px;}
  .quiz .ask{font-size:14px;color:#8a8aa0;text-align:center;font-weight:700;}
  .quiz .zh{font-size:40px;font-weight:900;text-align:center;margin:6px 0 2px;color:#3a3a55;}
  .speak{display:block;margin:2px auto 12px;background:#eef1ff;color:#4a63d6;border:none;border-radius:999px;padding:8px 18px;font-size:15px;font-weight:800;cursor:pointer;}
  .speak.big{font-size:22px;padding:16px 30px;margin:16px auto;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto;}
  .opt{background:#fff;color:#2b2b3a;border:2px solid #e3e7f5;border-radius:14px;padding:18px 6px;font-size:22px;font-weight:900;cursor:pointer;transition:.1s;}
  .opt:active{transform:scale(.97);}
  .opt.right{background:#39d353;border-color:#2bb344;color:#fff;}
  .opt.wrong{background:#ff5b6e;border-color:#e03b50;color:#fff;}
  .spellSlots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0;min-height:48px;}
  .slot{width:38px;height:46px;border-bottom:4px solid #b9c0dd;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;color:#3a3a55;}
  .slot.filled{border-bottom-color:#4a63d6;}
  .letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:auto;}
  .lt{width:46px;height:52px;background:#fff;border:2px solid #e3e7f5;border-radius:12px;font-size:24px;font-weight:900;color:#2b2b3a;cursor:pointer;}
  .lt:active{transform:scale(.94);} .lt.used{opacity:.28;pointer-events:none;}
  .undo{display:block;margin:10px auto 0;background:#eef1ff;color:#4a63d6;border:none;border-radius:10px;padding:8px 18px;font-size:14px;font-weight:800;cursor:pointer;}
  .matchGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:auto 0;}
  .mcard{background:#fff;border:2px solid #e3e7f5;border-radius:12px;padding:16px 4px;font-size:19px;font-weight:900;color:#2b2b3a;cursor:pointer;text-align:center;min-height:56px;display:flex;align-items:center;justify-content:center;transition:.1s;}
  .mcard.sel{background:#ffe8a3;border-color:#ffcf3f;} .mcard.done{background:#39d353;border-color:#2bb344;color:#fff;opacity:.5;pointer-events:none;} .mcard.bad{background:#ff5b6e;border-color:#e03b50;color:#fff;}

  /* 打工/探險 選單 */
  .jobrow{display:flex;align-items:center;gap:12px;background:#f7f9ff;border-radius:14px;padding:12px 14px;margin-bottom:10px;}
  .jobrow .ji{font-size:34px;}
  .jobrow .jinfo{flex:1;} .jobrow .jinfo b{font-size:16px;} .jobrow .jinfo div{font-size:12px;color:#8a8aa0;font-weight:700;}
  .jobrow .jgo{background:#5b8def;color:#fff;border:none;border-radius:12px;padding:10px 16px;font-weight:900;font-size:14px;cursor:pointer;}
  .jobrow .jgo:active{transform:scale(.96);}

  /* 家佈置商店 */
  .shopgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .shopitem{background:#f7f9ff;border-radius:14px;padding:12px 6px;text-align:center;border:2px solid #eef2fb;}
  .shopitem .si{font-size:34px;} .shopitem .sn{font-size:12px;font-weight:800;margin:4px 0;color:#3a3a55;}
  .shopitem button{background:#ffcf3f;color:#5b3a00;border:none;border-radius:10px;padding:6px 10px;font-weight:900;font-size:13px;cursor:pointer;width:100%;}
  .shopitem.owned button{background:#d7f0cf;color:#3a7a3a;}
  .shopitem button:active{transform:scale(.96);}

  .toast{position:fixed;top:32%;left:50%;transform:translate(-50%,-50%) scale(0);background:rgba(0,0,0,.82);color:#fff;padding:20px 30px;border-radius:18px;font-size:24px;font-weight:900;transition:transform .18s;z-index:30;text-align:center;max-width:80%;}
  .toast.show{transform:translate(-50%,-50%) scale(1);}
  .modal{position:fixed;inset:0;background:rgba(20,20,40,.6);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px;}
  .sheet{background:#fff;color:#2b2b3a;border-radius:20px;padding:22px;width:100%;max-width:420px;max-height:88%;overflow:auto;}
  .sheet h2{font-size:20px;font-weight:900;margin-bottom:4px;}
  .sheet .hint{font-size:13px;color:#8a8aa0;margin-bottom:14px;}
  .grades{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
  .gchk{border:2px solid #e3e7f5;border-radius:12px;padding:12px 4px;text-align:center;font-weight:800;font-size:15px;cursor:pointer;color:#5b5b7a;}
  .gchk.on{background:#5b8def;border-color:#4a63d6;color:#fff;}
  .stat{font-size:14px;color:#5b5b7a;line-height:1.9;background:#f5f6fb;border-radius:12px;padding:12px 14px;margin-bottom:14px;}
  .stat b{color:#2b2b3a;}
  .linkbtn{display:block;text-align:center;margin-top:10px;color:#e03b50;font-size:14px;font-weight:700;background:none;border:none;width:100%;cursor:pointer;}

  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
  @keyframes drift{0%,100%{transform:translateX(0);}50%{transform:translateX(14px);}}
</style>
</head>
<body>
<div class="app">

  <div id="login">
    <div class="logo">🥚</div>
    <h1>單字寵物</h1>
    <p>學英文單字，養出你自己的小龍！</p>
    <input id="nameInput" maxlength="8" placeholder="輸入你的名字">
    <button class="btn" onclick="start()">開始冒險 →</button>
  </div>

  <div id="home" class="hidden">
    <div class="hud">
      <div class="coin">🍎 <span id="food">0</span></div>
      <div class="coin">🪙 <span id="coins">0</span></div>
      <div class="who"><span id="petOwner">小龍</span><small>Lv.<span id="lv">1</span></small></div>
      <button class="gear" onclick="openSettings()">⚙️</button>
    </div>

    <div class="care">
      <div class="cchip" onclick="careUp('hunger')"><div class="ct"><span>🍖 肚子</span><span id="hungerV">100</span></div><div class="cbar hunger"><i id="hungerBar"></i></div></div>
      <div class="cchip" onclick="careUp('mood')"><div class="ct"><span>🎾 心情</span><span id="moodV">100</span></div><div class="cbar mood"><i id="moodBar"></i></div></div>
      <div class="cchip" onclick="careUp('clean')"><div class="ct"><span>🧼 乾淨</span><span id="cleanV">100</span></div><div class="cbar clean"><i id="cleanBar"></i></div></div>
    </div>

    <div class="petbar" id="petbar"></div>

    <div class="scene" id="scene">
      <div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div>
      <div class="stagebadge" id="stageName">蛋</div>
      <div class="decor" id="decor"></div>
      <div class="hero" id="hero">
        <div class="avatar" id="avatar">🥚</div>
        <div class="shadow"></div>
      </div>
      <div class="petname" id="petName">小龍</div>
      <div class="xpwrap">
        <div class="lvtag">經驗 · Lv.<span id="lv2">1</span></div>
        <div class="bar"><i id="xpbar"></i></div>
      </div>
      <!-- 外出遮罩 -->
      <div class="away hidden" id="away">
        <div class="big" id="awayIcon">💼</div>
        <div class="txt" id="awayTxt">上班中…</div>
        <div class="timer" id="awayTimer">00:00</div>
        <button class="claim hidden" id="awayClaim" onclick="claimAway()">領取獎勵 🎁</button>
      </div>
    </div>

    <div class="actions">
      <button class="act learn" id="btnLearn" onclick="openLearn()"><span class="ic">📚</span>學習</button>
      <button class="act feed" id="feedBtn" onclick="feed()"><span class="ic">🍖</span>餵食</button>
      <button class="act work" id="btnWork" onclick="openWork()"><span class="ic">💼</span>打工</button>
      <button class="act" id="btnTrip" onclick="openTrip()"><span class="ic">🗺️</span>探險</button>
      <button class="act" onclick="openShop()"><span class="ic">🛒</span>商店</button>
    </div>
  </div>

  <!-- 學習 -->
  <div class="sheetwrap hidden" id="learnWrap"><div class="sheet2">
    <div class="grab"></div>
    <div class="lhead"><div class="ltitle">📚 學習賺食物</div><button class="close" onclick="closeSheet('learnWrap')">✕</button></div>
    <div class="daily"><span>📅 今日</span><div class="dbar"><i id="dailyBar"></i></div><span id="dailyTxt">0/10</span></div>
    <div class="tabs">
      <button class="tab on" data-mode="pick" onclick="setMode('pick')">認字</button>
      <button class="tab" data-mode="spell" onclick="setMode('spell')">拼字</button>
      <button class="tab" data-mode="listen" onclick="setMode('listen')">聽音</button>
      <button class="tab" data-mode="match" onclick="setMode('match')">配對</button>
    </div>
    <div class="quiz" id="quiz"></div>
  </div></div>

  <!-- 打工 -->
  <div class="sheetwrap hidden" id="workWrap"><div class="sheet2">
    <div class="grab"></div>
    <div class="lhead"><div class="ltitle">💼 派寵物去打工賺金幣</div><button class="close" onclick="closeSheet('workWrap')">✕</button></div>
    <p style="font-size:13px;color:#8a8aa0;font-weight:700;margin-bottom:10px;">牠出門工作一段時間（關掉 App 也會繼續），時間到回來領金幣 🪙</p>
    <div id="jobList"></div>
  </div></div>

  <!-- 探險 -->
  <div class="sheetwrap hidden" id="tripWrap"><div class="sheet2">
    <div class="grab"></div>
    <div class="lhead"><div class="ltitle">🗺️ 出門探險</div><button class="close" onclick="closeSheet('tripWrap')">✕</button></div>
    <p style="font-size:13px;color:#8a8aa0;font-weight:700;margin-bottom:10px;">牠自己去旅行（離線也在跑），回來帶「單字明信片」＋金幣當紀念 📮</p>
    <div id="tripList"></div>
  </div></div>

  <!-- 商店：買食物 + 家佈置 -->
  <div class="sheetwrap hidden" id="shopWrap"><div class="sheet2">
    <div class="grab"></div>
    <div class="lhead"><div class="ltitle">🛒 商店（🪙 <span id="shopCoins">0</span>）</div><button class="close" onclick="closeSheet('shopWrap')">✕</button></div>
    <div style="font-weight:900;font-size:14px;margin:2px 0 8px;">🥚 買蛋（多養一隻）</div>
    <div class="shopgrid"><div class="shopitem"><div class="si">🥚</div><div class="sn">寵物蛋</div><button onclick="buyEgg()">🪙 <span id="eggCost">30</span></button></div></div>
    <div style="font-weight:900;font-size:14px;margin:16px 0 8px;">🍎 買食物（餵寵物用）</div>
    <div class="shopgrid" id="foodGrid"></div>
    <div style="font-weight:900;font-size:14px;margin:16px 0 8px;">🏡 家佈置</div>
    <div class="shopgrid" id="shopGrid"></div>
  </div></div>

  <div class="toast" id="toast"></div>
</div>

<script src="data/vocab.js"></script>
<script>
const STAGES = [
  {min:1,  emoji:"🥚",   name:"蛋",     img:"assets/pets/egg.png"},
  {min:3,  emoji:"🦎",   name:"小龍寶寶", img:"assets/pets/baby.png"},
  {min:10, emoji:"🐲",   name:"小龍",    img:"assets/pets/teen.png"},
  {min:25, emoji:"✨🐉", name:"進化龍",  img:"assets/pets/final.png"}
];
const XP_PER_LV = 50, XP_PER_FEED = 5, DAILY_GOAL = 10;
const CARE_DECAY_MIN = 6;              // 每 6 分鐘各狀態 -1
const SAVE_VER = 3;                    // 存檔版本（升級用）
const FOODPACKS = [                    // 用金幣買食物
  {n:1, cost:1}, {n:5, cost:4}, {n:15, cost:11}
];
const EGG_COST = 30;                   // 買一顆蛋（多養一隻）
// 打工/探險（單位：分鐘）——旅行青蛙式，離線也在跑
const JOBS = [
  {id:"cafe", ic:"☕", name:"咖啡店打工", min:30, coin:12},
  {id:"farm", ic:"🌾", name:"農場幫忙",   min:60, coin:28},
  {id:"post", ic:"📮", name:"郵局分信",   min:120, coin:65}
];
const TRIPS = [
  {id:"town", ic:"🏘️", name:"到鄰鎮走走", min:45, coin:8},
  {id:"mount",ic:"⛰️", name:"爬山探險",   min:90, coin:18},
  {id:"sea",  ic:"🏖️", name:"海邊旅行",   min:180, coin:40}
];
const SHOP = [
  {id:"plant", ic:"🪴", name:"盆栽", cost:15}, {id:"flower", ic:"🌸", name:"花叢", cost:20},
  {id:"sofa", ic:"🛋️", name:"沙發", cost:40}, {id:"pic", ic:"🖼️", name:"掛畫", cost:35},
  {id:"lamp", ic:"🏮", name:"燈籠", cost:25}, {id:"ball", ic:"🎈", name:"氣球", cost:18},
  {id:"tree", ic:"🌳", name:"小樹", cost:30}, {id:"fountain", ic:"⛲", name:"噴泉", cost:70},
  {id:"house", ic:"🏠", name:"小屋", cost:120}
];
const DECOR_SLOTS = [ // 場景中固定擺放位置
  {l:"10%",b:"12%"},{r:"12%",b:"12%"},{l:"6%",b:"34%"},{r:"7%",b:"34%"},
  {l:"22%",b:"6%"},{r:"24%",b:"6%"},{l:"14%",b:"54%"},{r:"16%",b:"54%"},{l:"46%",b:"4%"}
];

let S = load(), words = [], cur = null, mode = "pick", tick = null;

function load(){ try{ const raw=JSON.parse(localStorage.getItem("petSave")); return raw? migrate(raw): null; }catch(e){ return null; } }
function save(){ localStorage.setItem("petSave", JSON.stringify(S)); }
function today(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function now(){ return Date.now(); }

function newPet(species){ return {id:"p"+now()+Math.floor(Math.random()*1000), species:species||"dragon", xp:0, care:{hunger:100,mood:100,clean:100,ts:now()}, away:null}; }
function P(){ return S.pets[S.active]; }

/* 舊存檔自動升級：任何缺的欄位補預設，不刪既有進度。改版不必清資料。 */
function migrate(s){
  s = s || {};
  if(typeof s.name!=="string") s.name = "小勇者";
  if(typeof s.food!=="number") s.food = 0;
  if(typeof s.coins!=="number") s.coins = 0;
  if(typeof s.correct!=="number") s.correct = 0;
  if(!Array.isArray(s.grades) || !s.grades.length) s.grades = [1,2];
  if(!s.daily || s.daily.date!==today()) s.daily = {date:today(), n:0};
  if(!Array.isArray(s.home)) s.home = [];
  if(!Array.isArray(s.cards)) s.cards = [];
  // 多寵物：把舊的「單寵」存檔升級成 pets 陣列，保留原本等級與狀態
  if(!Array.isArray(s.pets) || !s.pets.length){
    const p = newPet("dragon");
    if(typeof s.xp==="number") p.xp = s.xp;
    if(s.care && typeof s.care.hunger==="number") p.care = s.care;
    if(s.away && typeof s.away.until==="number") p.away = s.away;
    s.pets = [p];
  }
  s.pets.forEach(p=>{
    if(typeof p.xp!=="number") p.xp = 0;
    if(!p.species) p.species = "dragon";
    if(!p.care || typeof p.care.hunger!=="number") p.care = {hunger:100,mood:100,clean:100,ts:now()};
    if(typeof p.care.ts!=="number") p.care.ts = now();
    if(p.away!==null && (!p.away || typeof p.away.until!=="number")) p.away = null;
    if(!p.id) p.id = "p"+Math.floor(Math.random()*1e9);
  });
  if(typeof s.active!=="number" || s.active<0 || s.active>=s.pets.length) s.active = 0;
  delete s.xp; delete s.care; delete s.away;   // 移除舊頂層單寵欄位
  s.ver = SAVE_VER;
  return s;
}

function start(){
  const n = document.getElementById("nameInput").value.trim() || "小勇者";
  if(!S) S = migrate({name:n});
  else S.name = n;
  save(); enterGame();
}
function enterGame(){
  words = getWords(S.grades);
  document.getElementById("login").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
  decayCare(); render();
  if(tick) clearInterval(tick); tick = setInterval(onTick, 1000);
}

function stageFor(lv){ let s=STAGES[0]; for(const st of STAGES){ if(lv>=st.min) s=st; } return s; }
function levelOf(){ return Math.floor(P().xp / XP_PER_LV) + 1; }
function setActive(i){ if(i<0||i>=S.pets.length) return; S.active=i; save(); render(); }

/* 狀態隨真實時間衰減（所有寵物一起老，離線也算） */
function decayCare(){
  let changed=false;
  S.pets.forEach(p=>{
    const c=p.care; const dec=Math.floor((now()-c.ts)/60000/CARE_DECAY_MIN);
    if(dec>0){ c.hunger=Math.max(0,c.hunger-dec); c.mood=Math.max(0,c.mood-dec); c.clean=Math.max(0,c.clean-dec); c.ts=c.ts+dec*CARE_DECAY_MIN*60000; changed=true; }
  });
  if(changed) save();
}
function careUp(k){
  const p=P();
  if(p.away){ toast("牠出門了，等牠回來 🕐"); return; }
  if(k==="hunger"){ if(S.food<1){ toast("沒食物了，去🛒商店買 🍎"); return; } S.food-=1; p.care.hunger=Math.min(100,p.care.hunger+20); toast("餵飽一點 😋"); }
  if(k==="mood"){ p.care.mood=Math.min(100,p.care.mood+20); toast("陪牠玩，好開心 🎾"); }
  if(k==="clean"){ p.care.clean=Math.min(100,p.care.clean+25); toast("洗香香 🧼✨"); }
  save(); render();
}

function render(){
  const p = P(), lv = levelOf(), st = stageFor(lv);
  document.getElementById("food").textContent = S.food;
  document.getElementById("coins").textContent = S.coins;
  document.getElementById("lv").textContent = lv;
  document.getElementById("lv2").textContent = lv;
  document.getElementById("stageName").textContent = st.name;
  document.getElementById("petOwner").textContent = S.name + " 的寵物";
  document.getElementById("petName").textContent = st.name;
  const av = document.getElementById("avatar");
  av.innerHTML = `<img src="${st.img}" alt="" onerror="this.parentNode.textContent='${st.emoji}'">`;
  document.getElementById("xpbar").style.width = ((p.xp % XP_PER_LV)/XP_PER_LV*100)+"%";
  document.getElementById("feedBtn").disabled = S.food < 1 || !!p.away;
  ["hunger","mood","clean"].forEach(k=>{
    document.getElementById(k+"Bar").style.width = p.care[k]+"%";
    document.getElementById(k+"V").textContent = p.care[k];
  });
  if(S.daily.date !== today()) S.daily = {date:today(), n:0};
  const dn = Math.min(S.daily.n, DAILY_GOAL);
  document.getElementById("dailyBar").style.width = (dn/DAILY_GOAL*100)+"%";
  document.getElementById("dailyTxt").textContent = dn+"/"+DAILY_GOAL;
  renderPetbar(); renderDecor(); renderAway();
}
function renderPetbar(){
  const bar = document.getElementById("petbar"); bar.innerHTML="";
  S.pets.forEach((p,i)=>{
    const lv=Math.floor(p.xp/XP_PER_LV)+1, st=stageFor(lv);
    const c=document.createElement("div"); c.className="pchip"+(i===S.active?" on":"");
    c.innerHTML=`<img src="${st.img}" alt="" onerror="this.parentNode.textContent='${st.emoji}'">`+(p.away?'<span class="dot">🕐</span>':'');
    c.onclick=()=>setActive(i); bar.appendChild(c);
  });
  const add=document.createElement("div"); add.className="pchip add"; add.textContent="＋"; add.title="買蛋養新的";
  add.onclick=()=>openShop(); bar.appendChild(add);
}

function renderDecor(){
  const d = document.getElementById("decor"); d.innerHTML="";
  S.home.slice(0,DECOR_SLOTS.length).forEach((id,i)=>{
    const item = SHOP.find(s=>s.id===id); if(!item) return;
    const sp = document.createElement("span"); sp.textContent = item.ic;
    const pos = DECOR_SLOTS[i];
    if(pos.l) sp.style.left=pos.l; if(pos.r) sp.style.right=pos.r; sp.style.bottom=pos.b;
    d.appendChild(sp);
  });
}

/* 外出（打工/探險）狀態 */
function renderAway(){
  const p = P(), away = document.getElementById("away");
  if(!p.away){ away.classList.add("hidden"); document.getElementById("hero").style.visibility="visible"; return; }
  away.classList.remove("hidden"); document.getElementById("hero").style.visibility="hidden";
  document.getElementById("awayIcon").textContent = p.away.ic;
  document.getElementById("awayTxt").textContent = p.away.name + "…";
  const done = now() >= p.away.until;
  document.getElementById("awayTimer").classList.toggle("hidden", done);
  document.getElementById("awayClaim").classList.toggle("hidden", !done);
  if(!done) document.getElementById("awayTimer").textContent = fmt(p.away.until - now());
}
function fmt(ms){ const s=Math.max(0,Math.ceil(ms/1000)); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return (h>0?h+":":"")+String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0"); }

function onTick(){ decayCare(); renderAway();
  // 每分鐘刷新一次 care 顯示
  if(now()%60000 < 1000) render();
}

function goAway(kind, job){
  const p=P();
  if(p.away){ toast("牠已經出門了"); return; }
  p.away = {kind, id:job.id, ic:job.ic, name:job.name, coin:job.coin, until: now() + job.min*60000};
  save(); closeSheet(kind==="work"?"workWrap":"tripWrap"); render();
  toast(job.ic+" 出發！"+ (job.min>=60? Math.round(job.min/60)+" 小時":job.min+" 分") +"後回來");
}
function claimAway(){
  const p=P(), a=p.away; if(!a) return;
  S.coins += a.coin;
  let extra = "";
  if(a.kind==="trip" && words.length){ const w = words[Math.floor(Math.random()*words.length)];
    if(!S.cards.includes(w.en)) S.cards.push(w.en); extra = "＋單字明信片「"+w.en+"」📮"; }
  p.care.mood = Math.min(100, p.care.mood+15);
  p.away = null; save(); render();
  toast("回來了！🪙+"+a.coin+" "+extra);
}

function openWork(){ if(guardAway())return; const l=document.getElementById("jobList"); l.innerHTML="";
  JOBS.forEach(j=> l.appendChild(jobRow(j,"work"))); openSheet("workWrap"); }
function openTrip(){ if(guardAway())return; const l=document.getElementById("tripList"); l.innerHTML="";
  TRIPS.forEach(j=> l.appendChild(jobRow(j,"trip"))); openSheet("tripWrap"); }
function guardAway(){ if(P().away){ toast("牠出門了，等牠回來 🕐"); return true; } return false; }
function jobRow(j,kind){
  const div=document.createElement("div"); div.className="jobrow";
  const dur = j.min>=60? (j.min/60)+" 小時" : j.min+" 分鐘";
  div.innerHTML = `<div class="ji">${j.ic}</div><div class="jinfo"><b>${j.name}</b><div>${dur} · 回來 🪙+${j.coin}${kind==="trip"?" ＋明信片":""}</div></div>`;
  const b=document.createElement("button"); b.className="jgo"; b.textContent="出發"; b.onclick=()=>goAway(kind,j);
  div.appendChild(b); return div;
}

/* 商店：買食物 + 家佈置 */
function openShop(){
  document.getElementById("shopCoins").textContent = S.coins;
  document.getElementById("eggCost").textContent = EGG_COST;
  // 買食物
  const fg=document.getElementById("foodGrid"); fg.innerHTML="";
  FOODPACKS.forEach(p=>{
    const d=document.createElement("div"); d.className="shopitem";
    d.innerHTML = `<div class="si">🍎</div><div class="sn">食物 ×${p.n}</div>`;
    const b=document.createElement("button"); b.textContent = "🪙 "+p.cost; b.onclick=()=>buyFood(p);
    d.appendChild(b); fg.appendChild(d);
  });
  // 家佈置
  const g=document.getElementById("shopGrid"); g.innerHTML="";
  SHOP.forEach(item=>{
    const owned = S.home.includes(item.id);
    const d=document.createElement("div"); d.className="shopitem"+(owned?" owned":"");
    d.innerHTML = `<div class="si">${item.ic}</div><div class="sn">${item.name}</div>`;
    const b=document.createElement("button"); b.textContent = owned?"已擁有":("🪙 "+item.cost);
    if(!owned) b.onclick=()=>buyItem(item); d.appendChild(b); g.appendChild(d);
  });
  openSheet("shopWrap");
}
function buyFood(p){
  if(S.coins < p.cost){ toast("金幣不夠，去學習或打工賺 🪙"); return; }
  S.coins -= p.cost; S.food += p.n; save();
  document.getElementById("shopCoins").textContent = S.coins;
  render(); toast("買到食物 🍎+"+p.n);
}
function buyEgg(){
  if(S.coins < EGG_COST){ toast("金幣不夠買蛋（需 🪙"+EGG_COST+"）"); return; }
  S.coins -= EGG_COST; S.pets.push(newPet("dragon")); S.active = S.pets.length-1; save();
  document.getElementById("shopCoins").textContent = S.coins;
  closeSheet("shopWrap"); render();
  toast("買了一顆蛋 🥚 開始養新寵物！");
}
function buyItem(item){
  if(S.home.includes(item.id)) return;
  if(S.coins < item.cost){ toast("金幣不夠，去打工賺 💼"); return; }
  S.coins -= item.cost; S.home.push(item.id); save();
  document.getElementById("shopCoins").textContent = S.coins;
  openShop(); render(); toast(item.ic+" 買下了！擺進家裡 🏡");
}

/* 學習 */
function openLearn(){ openSheet("learnWrap"); setMode(mode); }
function openSheet(id){ document.getElementById(id).classList.remove("hidden"); }
function closeSheet(id){ document.getElementById(id).classList.add("hidden"); render(); }

function gotRight(bonus){
  const n = bonus||1; S.coins += n; S.correct += 1;   // 答對單字 → 賺錢（不是直接給食物）
  S.daily.n = (S.daily.n||0) + 1;
  if(S.daily.n === DAILY_GOAL){ S.coins += 5; toast("每日任務完成！🎁 🪙+5"); }
  save(); render();
}
function setMode(m){ mode=m;
  document.querySelectorAll(".tab").forEach(t=> t.classList.toggle("on", t.dataset.mode===m));
  if(m==="pick") renderPick(); else if(m==="spell") renderSpell(); else if(m==="listen") renderListen(); else if(m==="match") renderMatch(); }
function pickWord(){ return words[Math.floor(Math.random()*words.length)]; }
function distractors(en,n){ const o=[]; let g=0; while(o.length<n&&g++<200){ const w=pickWord().en; if(w!==en&&!o.includes(w)) o.push(w);} return o; }

function renderPick(){
  cur=pickWord(); const opts=[cur.en,...distractors(cur.en,3)]; shuffle(opts);
  document.getElementById("quiz").innerHTML=`<div class="ask">這個中文，英文是哪一個？</div><div class="zh">${cur.zh}</div>
    <button class="speak" onclick="speak(cur.en)">🔊 唸唸看</button><div class="opts" id="opts"></div>`;
  const box=document.getElementById("opts");
  opts.forEach(w=>{ const b=document.createElement("button"); b.className="opt"; b.textContent=w;
    b.onclick=()=>{ lock(); if(w===cur.en){ b.classList.add("right"); gotRight(1); speak(cur.en); toast("答對了！🪙+1"); setTimeout(renderPick,800);}
      else{ b.classList.add("wrong"); markRight(cur.en); toast("再試試看 💪"); setTimeout(renderPick,1100);} }; box.appendChild(b); });
  setTimeout(()=>speak(cur.en),250);
}
let spellPicked=[];
function renderSpell(){ cur=pickWord(); spellPicked=[]; const bank=shuffle(cur.en.split(""));
  document.getElementById("quiz").innerHTML=`<div class="ask">看中文，把字母排成英文</div><div class="zh">${cur.zh}</div>
    <button class="speak" onclick="speak(cur.en)">🔊 提示發音</button><div class="spellSlots" id="slots"></div>
    <div class="letters" id="letters"></div><button class="undo" onclick="spellUndo()">⌫ 退一格</button>`;
  drawSlots(); const lb=document.getElementById("letters");
  bank.forEach(ch=>{ const b=document.createElement("button"); b.className="lt"; b.textContent=ch; b.onclick=()=>spellTap(ch,b); lb.appendChild(b); }); }
function drawSlots(){ const s=document.getElementById("slots"); s.innerHTML="";
  cur.en.split("").forEach((_,i)=>{ const d=document.createElement("div"); d.className="slot"+(spellPicked[i]?" filled":""); d.textContent=spellPicked[i]||""; s.appendChild(d); }); }
function spellTap(ch,btn){ if(spellPicked.length>=cur.en.length) return; spellPicked.push(ch); btn.classList.add("used"); drawSlots();
  if(spellPicked.length===cur.en.length){ if(spellPicked.join("")===cur.en){ gotRight(1); speak(cur.en); toast("拼對了！🪙+1"); setTimeout(renderSpell,900);} else{ toast("拼錯囉，再來 💪"); setTimeout(renderSpell,1100);} } }
function spellUndo(){ if(!spellPicked.length) return; spellPicked.pop(); const u=document.querySelectorAll("#letters .lt.used"); if(u.length) u[u.length-1].classList.remove("used"); drawSlots(); }
function renderListen(){ cur=pickWord(); const opts=[cur.en,...distractors(cur.en,3)]; shuffle(opts);
  document.getElementById("quiz").innerHTML=`<div class="ask">聽發音，選出你聽到的英文單字</div><button class="speak big" onclick="speak(cur.en)">🔊 再聽一次</button><div class="opts" id="opts"></div>`;
  const box=document.getElementById("opts");
  opts.forEach(w=>{ const b=document.createElement("button"); b.className="opt"; b.textContent=w;
    b.onclick=()=>{ lock(); if(w===cur.en){ b.classList.add("right"); gotRight(1); speak(cur.en); toast("聽對了！🪙+1"); setTimeout(renderListen,800);}
      else{ b.classList.add("wrong"); markRight(cur.en); toast("再聽聽看 💪"); setTimeout(renderListen,1100);} }; box.appendChild(b); });
  setTimeout(()=>speak(cur.en),300); }
let mSel=null,mLeft=0;
function renderMatch(){ const pool=[],seen=new Set(); while(pool.length<4&&seen.size<words.length){ const w=pickWord(); if(!seen.has(w.en)){seen.add(w.en);pool.push(w);} }
  mLeft=pool.length; mSel=null; const cards=[]; pool.forEach(w=>{cards.push({k:w.en,t:w.en,en:w.en});cards.push({k:w.en,t:w.zh,en:w.en});}); shuffle(cards);
  document.getElementById("quiz").innerHTML=`<div class="ask">把英文和中文兩兩配對消除</div><div class="matchGrid" id="mgrid"></div>`;
  const g=document.getElementById("mgrid"); cards.forEach(c=>{ const b=document.createElement("div"); b.className="mcard"; b.textContent=c.t; b.onclick=()=>matchTap(b,c); g.appendChild(b); }); }
function matchTap(b,c){ if(b.classList.contains("done")) return;
  if(!mSel){ mSel={b,c}; b.classList.add("sel"); if(c.t===c.en) speak(c.en); return; }
  if(mSel.b===b){ b.classList.remove("sel"); mSel=null; return; }
  if(mSel.c.k===c.k){ b.classList.add("done"); mSel.b.classList.remove("sel"); mSel.b.classList.add("done"); mSel=null; mLeft--; gotRight(1); speak(c.en);
    if(mLeft<=0){ toast("全部配對完成！🎉"); save(); render(); setTimeout(renderMatch,900);} }
  else{ b.classList.add("bad"); mSel.b.classList.add("bad"); const s1=mSel.b,s2=b; setTimeout(()=>{ s1.classList.remove("bad","sel"); s2.classList.remove("bad"); },550); mSel=null; } }

function feed(){ if(guardAway())return; if(S.food<1){ toast("沒食物了，去🛒商店買 🍎"); return; }
  const p=P(); const before=stageFor(levelOf()).name; S.food-=1; p.xp+=XP_PER_FEED; p.care.hunger=Math.min(100,p.care.hunger+15); save();
  const after=stageFor(levelOf()).name; const av=document.getElementById("avatar"); av.style.transform="scale(1.18)"; setTimeout(()=>av.style.transform="",300); render();
  if(before!==after) toast("進化！變成「"+after+"」🎉"); else toast("牠吃得好開心 😋"); }

function openSettings(){
  const m=document.createElement("div"); m.className="modal"; m.id="settingsModal";
  m.innerHTML=`<div class="sheet"><h2>⚙️ 家長後台</h2><div class="hint">勾選目前要出現的單字年級（可複選）</div>
    <div class="grades" id="gradeChk"></div>
    <div class="stat">玩家：<b>${S.name}</b><br>累計答對：<b>${S.correct}</b> 題 · 今日：<b>${Math.min(S.daily.n,DAILY_GOAL)}/${DAILY_GOAL}</b><br>
      等級：<b>Lv.${levelOf()}</b>（${stageFor(levelOf()).name}） · 金幣：<b>🪙${S.coins}</b><br>
      收集明信片：<b>${S.cards.length}</b> 張 · 題庫：<b id="poolCount">-</b> 字</div>
    <button class="btn" onclick="saveSettings()">儲存並繼續</button>
    <button class="linkbtn" style="color:#4a63d6" onclick="renameUser()">✏️ 改名字</button>
    <button class="linkbtn" onclick="resetAll()">重設全部進度</button></div>`;
  document.body.appendChild(m);
  const g=document.getElementById("gradeChk");
  for(let i=1;i<=6;i++){ const on=S.grades.includes(i); const d=document.createElement("div"); d.className="gchk"+(on?" on":""); d.textContent=i+"年級"; d.dataset.g=i; d.onclick=()=>{d.classList.toggle("on"); updatePool();}; g.appendChild(d); }
  updatePool(); m.onclick=(e)=>{ if(e.target===m) m.remove(); };
}
function chosenGrades(){ return [...document.querySelectorAll(".gchk.on")].map(d=>+d.dataset.g); }
function updatePool(){ const gs=chosenGrades(); document.getElementById("poolCount").textContent=getWords(gs.length?gs:[1]).length; }
function saveSettings(){ let gs=chosenGrades(); if(!gs.length) gs=[1]; S.grades=gs; save(); words=getWords(gs);
  document.getElementById("settingsModal").remove(); if(!document.getElementById("learnWrap").classList.contains("hidden")) setMode(mode); toast("已更新單字範圍 ✅"); }
function resetAll(){ if(!confirm("確定要清空這台裝置上的進度嗎？")) return; localStorage.removeItem("petSave"); location.reload(); }
function renameUser(){ const n=prompt("輸入新名字：", S.name); if(n===null) return; const t=n.trim(); if(!t) return; S.name=t; save(); render(); const md=document.getElementById("settingsModal"); if(md) md.remove(); toast("改名成功："+t); }

function lock(){ document.querySelectorAll(".opt").forEach(o=>o.onclick=null); }
function markRight(en){ document.querySelectorAll(".opt").forEach(o=>{ if(o.textContent===en) o.classList.add("right"); }); }
function speak(t){ if(!t||!window.speechSynthesis) return; const u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=.85; speechSynthesis.cancel(); speechSynthesis.speak(u); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1000); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// 已有存檔 → 自動進遊戲，不必每次輸入名字（第一次玩才顯示登入畫面）
if(S){ enterGame(); }
</script>
